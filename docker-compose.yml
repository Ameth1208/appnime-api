services:
  appnime-backend:
    container_name: appnime-backend
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-4000}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - ACCESS_TOKEN_TTL_SECONDS=${ACCESS_TOKEN_TTL_SECONDS:-900}
      - REFRESH_TOKEN_TTL_SECONDS=${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      - PAYMENT_GRACE_HOURS=${PAYMENT_GRACE_HOURS:-48}
      - OFFLINE_GRACE_HOURS=${OFFLINE_GRACE_HOURS:-72}
      - LEASE_REFRESH_AFTER_HOURS=${LEASE_REFRESH_AFTER_HOURS:-6}
      - USAGE_SESSION_STALE_SECONDS=${USAGE_SESSION_STALE_SECONDS:-180}
      - DEVICE_LINK_TTL_SECONDS=${DEVICE_LINK_TTL_SECONDS:-600}
      - INVITATION_TTL_HOURS=${INVITATION_TTL_HOURS:-168}
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
      - STORAGE_LOCAL_ROOT=/app/storage
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_REGION=${S3_REGION:-auto}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_PUBLIC_BASE_URL=${S3_PUBLIC_BASE_URL:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - CATALOG_EMBED_SOURCES=${CATALOG_EMBED_SOURCES:-vidsrc.xyz,autoembed,multiembed,vidlink}
      - CATALOG_VIDLINK=${CATALOG_VIDLINK:-on}
      - FLARESOLVERR_URL=${FLARESOLVERR_URL:-http://appnime-flaresolverr:8191}
      - MEILI_HOST=${MEILI_HOST:-http://appnime-meilisearch:7700}
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-appnime-meili-key}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-}
      - INITIAL_USER_EMAIL=${INITIAL_USER_EMAIL:-}
      - INITIAL_USER_PASSWORD=${INITIAL_USER_PASSWORD:-}
    depends_on:
      - appnime-meilisearch
    volumes:
      - appnime_storage:/app/storage
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${PORT:-4000}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  appnime-meilisearch:
    container_name: appnime-meilisearch
    image: getmeili/meilisearch:v1.8
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-appnime-meili-key}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili_data:/meili_data
    networks:
      - dokploy-network

  appnime-flaresolverr:
    container_name: appnime-flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
    networks:
      - dokploy-network

volumes:
  appnime_storage:
  meili_data:

networks:
  dokploy-network:
    external: true
