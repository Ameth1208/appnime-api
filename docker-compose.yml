services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: appnime
      POSTGRES_PASSWORD: appnime
      POSTGRES_DB: appnime
    ports:
      - "5432:5432"
    volumes:
      - appnime_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appnime"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  appnime_pg:
